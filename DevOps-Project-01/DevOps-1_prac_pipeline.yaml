trigger:
  branches:
    include:
      - master

pr: none


# ============================================================
# SELF-HOSTED WINDOWS AGENT
# ============================================================

pool:
  name: 'batch13-pool'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Java
  javaVersion: '11'

  # Application
  appDirectory: 'DevOps-Project-01\Java-Login-App'

  # Azure Storage
  storageAccount: 'vishalsa007'
  containerName: 'vishalcontainer'

  # Artifact
  artifactName: 'java-login-app'

  # Azure service connection
  azureServiceConnection: 'batch13-connection'


# ============================================================
# STAGES
# ============================================================

stages:

# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: 'Build Java Login Application'

  jobs:

  - job: MavenBuild
    displayName: 'Maven Build'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout source code'


    # --------------------------------------------------------
    # VERIFY JAVA
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "JAVA VERSION"
        Write-Host "========================================"

        java -version

        Write-Host ""
        Write-Host "========================================"
        Write-Host "MAVEN VERSION"
        Write-Host "========================================"

        Set-Location "$(appDirectory)"

        .\mvnw.cmd --version

      displayName: 'Verify Java and Maven'


    # --------------------------------------------------------
    # MAVEN BUILD
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "BUILDING APPLICATION"
        Write-Host "========================================"

        Set-Location "$(appDirectory)"

        .\mvnw.cmd clean package -DskipTests

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Maven build failed."
            exit 1
        }

      displayName: 'Maven clean package'


    # --------------------------------------------------------
    # VERIFY BUILD
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "BUILD OUTPUT"
        Write-Host "========================================"

        Set-Location "$(appDirectory)"

        Write-Host ""
        Write-Host "Target directory:"
        Get-ChildItem .\target

        Write-Host ""
        Write-Host "Generated JAR/WAR files:"

        Get-ChildItem .\target -Include *.jar,*.war -File

      displayName: 'Verify generated artifact'


    # --------------------------------------------------------
    # PREPARE ARTIFACT
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "PREPARING ARTIFACT"
        Write-Host "========================================"

        $artifactDirectory = "$(Build.ArtifactStagingDirectory)\$(artifactName)"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $artifactDirectory | Out-Null

        Set-Location "$(appDirectory)"

        $files = Get-ChildItem .\target -Include *.jar,*.war -File

        if ($files.Count -eq 0) {
            Write-Error "No JAR or WAR file was generated."
            exit 1
        }

        foreach ($file in $files) {

            Copy-Item `
              $file.FullName `
              $artifactDirectory `
              -Force

            Write-Host "Copied: $($file.Name)"
        }

        Write-Host ""
        Write-Host "Artifact directory:"
        Get-ChildItem $artifactDirectory

      displayName: 'Prepare application artifact'


    # --------------------------------------------------------
    # CREATE ZIP
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "CREATING ZIP ARTIFACT"
        Write-Host "========================================"

        $artifactDirectory = "$(Build.ArtifactStagingDirectory)\$(artifactName)"

        $zipFile = "$(Build.ArtifactStagingDirectory)\$(artifactName)-$(Build.BuildNumber).zip"

        Compress-Archive `
          -Path "$artifactDirectory\*" `
          -DestinationPath $zipFile `
          -Force

        Write-Host ""
        Write-Host "Created artifact:"
        Write-Host $zipFile

        Write-Host ""
        Get-ChildItem "$(Build.ArtifactStagingDirectory)"

      displayName: 'Create ZIP artifact'


# ============================================================
# STAGE 2 - UPLOAD TO AZURE STORAGE
# ============================================================

- stage: Upload
  displayName: 'Upload Artifact to Azure Storage'

  dependsOn: Build

  condition: succeeded()

  jobs:

  - job: UploadArtifact
    displayName: 'Upload to vishalsa007'

    steps:

    # --------------------------------------------------------
    # UPLOAD ZIP TO STORAGE ACCOUNT
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Upload Artifact to Azure Blob Storage'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          Write-Host "========================================"
          Write-Host "AZURE STORAGE UPLOAD"
          Write-Host "========================================"

          Write-Host "Storage Account : $(storageAccount)"
          Write-Host "Container       : $(containerName)"

          $artifact = "$(Build.ArtifactStagingDirectory)\$(artifactName)-$(Build.BuildNumber).zip"

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $artifact

          if (!(Test-Path $artifact)) {
              Write-Error "Artifact not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Uploading artifact..."

          az storage blob upload `
            --account-name "$(storageAccount)" `
            --container-name "$(containerName)" `
            --name "$(artifactName)-$(Build.BuildNumber).zip" `
            --file "$artifact" `
            --auth-mode login `
            --overwrite true

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Azure Storage upload failed."
              exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "UPLOAD SUCCESSFUL"
          Write-Host "========================================"


    # --------------------------------------------------------
    # DISPLAY HTTP URL
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Display Artifact HTTP URL'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'ps'

        scriptLocation: 'inlineScript'

        inlineScript: |

          $blobName = "$(artifactName)-$(Build.BuildNumber).zip"

          $url = "https://$(storageAccount).blob.core.windows.net/$(containerName)/$blobName"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "ARTIFACT UPLOAD COMPLETED"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Storage Account:"
          Write-Host "$(storageAccount)"

          Write-Host ""
          Write-Host "Container:"
          Write-Host "$(containerName)"

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $blobName

          Write-Host ""
          Write-Host "HTTP / HTTPS URL:"
          Write-Host $url

          Write-Host ""
          Write-Host "=================================================="
